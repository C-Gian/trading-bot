[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyarrow>=17,<22", "httpx>=0.27,<1", "jsonschema>=4.23,<5", "numpy>=2,<3", "tzdata>=2025.2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "backend"}
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008", "BLE001", "RUF007"]
[tool.ruff.format]
# These files are byte-frozen by the WP-013 safe commit and preregistration. They passed
# lint and typing before execution; do not rewrite their post-result dependency identity.
exclude = [
  "backend/app/research/wp013.py",
  "backend/app/research/wp013_lab.py",
  "scripts/audit_wp013_context.py",
  "scripts/build_wp013_admission.py",
  "scripts/run_wp013.py",
]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
